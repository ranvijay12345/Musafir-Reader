<?xml version="1.0" encoding="UTF-8"?>
<!--
  Musafir Reader — Google Play Store listing icon (512 x 512).
  Same artwork as the in-app launcher icon (drawable/ic_launcher_foreground.xml
  + ic_launcher_background.xml), scaled from the 108-unit design to 512 px.
  Full-bleed, opaque, square — Play rounds the corners itself, so do NOT add
  rounding or transparency. Export to PNG (see ICON-README.md) and upload as the
  "App icon" in Play Console → Store listing.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="42.6%" cy="38.9%" r="76%">
      <stop offset="0%"  stop-color="#C9773C"/>
      <stop offset="100%" stop-color="#9E4E1C"/>
    </radialGradient>
  </defs>

  <!-- Background (full bleed) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Everything below is the 108-unit artwork scaled by 512/108 ≈ 4.7407 -->
  <g transform="scale(4.74074)">
    <!-- Soft page shadow behind the book -->
    <path fill="#000000" fill-opacity="0.12"
      d="M54,52.5C46.5,46 36.5,44.5 26,46.5C24.6,46.8 23.5,48 23.5,49.5V79.5C23.5,81 24.8,82.2 26.3,81.9C36,80.1 46,81.7 54,88C62,81.7 72,80.1 81.7,81.9C83.2,82.2 84.5,81 84.5,79.5V49.5C84.5,48 83.4,46.8 82,46.5C71.5,44.5 61.5,46 54,52.5Z"/>

    <!-- Left page -->
    <path fill="#FBF6EC"
      d="M54,50C46.5,43.5 36.5,42 26,44C24.6,44.3 23.5,45.5 23.5,47V77C23.5,78.5 24.8,79.7 26.3,79.4C36,77.6 46,79.2 54,85.5Z"/>
    <!-- Right page -->
    <path fill="#F2E9D6"
      d="M54,50C61.5,43.5 71.5,42 82,44C83.4,44.3 84.5,45.5 84.5,47V77C84.5,78.5 83.2,79.7 81.7,79.4C72,77.6 62,79.2 54,85.5Z"/>
    <!-- Spine -->
    <path fill="#8A4A1E" d="M52,50H56V85.5H52Z"/>

    <!-- Page lines -->
    <g stroke="#C9773C" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M31,54 L48,52.5 M31,61 L48,59.5 M31,68 L48,66.5"/>
      <path d="M60,52.5 L77,54 M60,59.5 L77,61 M60,66.5 L77,68"/>
    </g>

    <!-- Guiding star -->
    <path fill="#F4B23E"
      d="M54,20L58.35,32.4L71.4,32.7L61,40.7L64.75,53.2L54,45.7L43.25,53.2L47,40.7L36.6,32.7L49.65,32.4Z"/>
    <!-- Star highlight -->
    <path fill="#FFD37A" d="M54,20L58.35,32.4L54,35.5L49.65,32.4Z"/>
  </g>
</svg>
